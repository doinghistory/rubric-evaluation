<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルーブリック評価</title>
<style>
:root{font-family:'UD デジタル 教科書体 N-R','UD Digi Kyokasho N-R','Yu Gothic',Meiryo,sans-serif;color:#192d49;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}header{background:#152e4f;color:#fff;border-bottom:4px solid #b49a59;padding:18px max(20px,calc((100vw - 1080px)/2));font-size:22px;font-weight:700}main{max-width:1080px;margin:32px auto;padding:0 18px 60px}.panel{background:#fff;border:1px solid #e0e4e9;border-radius:5px;padding:25px;margin-bottom:18px}.login{max-width:500px;margin:55px auto}h1{font-size:22px;margin:0 0 20px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:18px 0 10px}p{line-height:1.6}label{display:block;font-weight:600;font-size:14px;margin:11px 0 6px}input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:1px solid #c6cfdb;border-radius:4px;background:white;color:#192d49}textarea{min-height:74px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #b49a59;outline-offset:1px}button{font:inherit;cursor:pointer;background:#17385e;color:#fff;border:1px solid #17385e;border-radius:4px;padding:9px 16px;min-height:41px}button:hover{background:#244c78}button:disabled{opacity:.55;cursor:wait}.secondary{background:white;color:#17385e;border-color:#aebac8}.secondary:hover{background:#f0f3f7}.small{font-size:13px;padding:5px 11px;min-height:32px}.danger{color:#9e2634}.muted{color:#687688;font-size:13px}.hidden{display:none!important}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grow{flex:1}.notice{padding:11px 13px;background:#f5f7fa;border-left:3px solid #b49a59;font-size:14px;margin:15px 0;white-space:pre-wrap}.notice.error{background:#fff5f5;border-color:#c74242;color:#9e2634}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.tabs button{background:white;color:#17385e;border-color:#b9c3cd}.tabs button.active{color:white;background:#17385e;border-color:#17385e}.item{padding:13px 0;border-bottom:1px solid #e6e9ee}.item:last-child{border-bottom:0}.item button{margin-left:auto}.meta{font-size:12px;color:#6a7786}.table-wrap{overflow:auto;width:100%;border:1px solid #e1e6ea;border-radius:4px}table{border-collapse:collapse;min-width:610px;width:100%;font-size:14px}th,td{border-bottom:1px solid #e4e8ec;padding:12px;text-align:left;vertical-align:top}thead th{background:#f0f3f7}td:first-child{min-width:160px}th:not(:first-child){min-width:135px}td button{width:100%;font-size:13px;min-height:58px;white-space:normal;background:#fff;color:#243b56;border:1px solid #c9d1dc;text-align:left;margin:2px 0}td button.selected{background:#edf1f6;border:2px solid #b49a59;color:#142d4f;font-weight:700}td button:hover{background:#eef3f8}.pill{padding:3px 9px;border:1px solid #c4ced7;border-radius:3px;font-size:12px;color:#52647b}.loading{opacity:.6;pointer-events:none}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.actions button{margin-top:0}.right{text-align:right}@media(max-width:680px){.grid{grid-template-columns:1fr}main{margin:18px auto}.panel{padding:17px}header{font-size:19px}.flex.between{align-items:flex-start}}
</style>
</head>
<body>
<header>ルーブリック評価</header>
<main>
<section class="panel login" id="login-view"><h1>ログイン</h1><form id="login-form"><label for="employee">職員番号</label><input id="employee" type="text" inputmode="numeric" autocomplete="username" maxlength="6" pattern="[0-9]{6}" placeholder="6桁の職員番号" required><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button id="login-button" type="submit">ログイン</button></div></form><div id="login-message" class="notice hidden" role="status" aria-live="polite"></div></section>
<section id="app-view" class="hidden"><div class="panel"><div class="flex between"><div><h1 style="margin-bottom:5px">評価プロジェクト</h1><div class="muted" id="account"></div></div><button type="button" id="logout" class="secondary">ログアウト</button></div></div><div id="app-notice" class="notice hidden" role="status" aria-live="polite"></div>
<div id="project-list-view" class="panel"><div class="flex between"><h2>プロジェクト一覧</h2><button id="new-project" type="button">新規作成</button></div><div id="project-list" class="muted">読み込み中…</div></div>
<div id="project-create-view" class="panel hidden"><div class="flex between"><h2>新しいプロジェクト</h2><button class="secondary small" type="button" data-back>戻る</button></div><form id="project-form"><label>プロジェクト名</label><input id="project-name" placeholder="例：探究活動 第1学期" maxlength="120" required><div class="grid"><div><label>評価対象</label><select id="project-kind"><option value="individual">個人</option><option value="group">グループ</option></select></div><div><label>評価段階</label><select id="project-scale"><option value="3">3段階</option><option value="4" selected>4段階</option><option value="5">5段階</option></select></div></div><div class="actions"><button type="submit">作成する</button></div></form></div>
<div id="project-detail-view" class="hidden"><div class="panel"><div class="flex between"><div><button id="back-list" type="button" class="secondary small">← 一覧へ</button><h1 id="detail-title" style="margin:14px 0 3px"></h1><div id="detail-subtitle" class="muted"></div></div><button id="export-csv" class="secondary" type="button">CSV出力</button></div></div><div class="tabs"><button type="button" data-tab="targets" class="active">評価対象</button><button type="button" data-tab="criteria">ルーブリック</button><button type="button" data-tab="evaluate">評価入力</button><button type="button" data-tab="results">評価一覧</button></div>
<div class="panel" id="tab-targets"><h2>評価対象の登録</h2><p class="muted">生徒名・グループ名を1行に1件ずつ入力してください。</p><form id="targets-form"><label for="target-names">名前（複数行可）</label><textarea id="target-names" placeholder="生徒A&#10;生徒B&#10;生徒C" required></textarea><div class="actions"><button type="submit">追加する</button></div></form><h3>登録済み</h3><div id="targets-list" class="muted"></div></div>
<div class="panel hidden" id="tab-criteria"><h2>ルーブリックの作成</h2><p class="muted">各評価段階の基準を記入します。1が最も低い段階、最大値が最も高い段階です。</p><form id="criterion-form"><label for="criterion-title">評価項目</label><input id="criterion-title" required placeholder="例：資料の活用"><label for="criterion-description">説明（任意）</label><input id="criterion-description" placeholder="評価の観点を記入"><div id="criterion-descriptors" class="grid"></div><div class="actions"><button type="submit">評価項目を追加</button></div></form><h3>登録済みの評価項目</h3><div id="criteria-list" class="muted"></div></div>
<div class="panel hidden" id="tab-evaluate"><h2>評価入力</h2><div class="grid"><div><label for="evaluate-target">評価対象</label><select id="evaluate-target"></select></div><div><label>評価者</label><input id="evaluate-teacher" disabled></div></div><div id="evaluation-body" style="margin-top:18px"></div><label for="evaluate-comment">コメント（任意）</label><textarea id="evaluate-comment" placeholder="講評を入力"></textarea><div class="actions"><button type="button" id="save-evaluation">評価を保存</button><span class="muted" id="save-status"></span></div></div>
<div class="panel hidden" id="tab-results"><h2>評価一覧</h2><p class="muted">評価者ごとの記録を表示します。全件をダウンロードするには「CSV出力」を押してください。</p><div id="results-list"></div></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const PROJECT_URL='https://cdoydtconrygubkyeyym.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_KApWphyPCNW8M9U95_kPCg_Oxuy3KA4';
const client=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const state={user:null,profile:null,projects:[],project:null,targets:[],criteria:[],assessments:[],scores:[],selectedTarget:null,selectedScores:{},selectedAssessment:null,tab:'targets'};
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s,error=false,login=false){const el=$(login?'login-message':'app-notice');el.textContent=s;el.classList.toggle('hidden',!s);el.classList.toggle('error',error);if(error)console.warn(s);}
function fail(e,context='操作'){console.error(e);notify(context+'に失敗しました。'+(e?.message?' '+e.message:''),true);}
function showOnly(view){for(const id of ['project-list-view','project-create-view','project-detail-view'])$(id).classList.toggle('hidden',id!==view);}
function showLogin(){state.user=null;state.profile=null;$('app-view').classList.add('hidden');$('login-view').classList.remove('hidden');$('password').value='';}
async function checked(promise){const x=await promise;if(x.error)throw x.error;return x.data;}
async function showHome(user){
 try{const profile=await checked(client.from('profiles').select('employee_no,display_name,role,is_active').eq('id',user.id).single());
  if(!profile.is_active){await client.auth.signOut();showLogin();notify('このアカウントは利用停止中です。',true,true);return;}
  state.user=user;state.profile=profile;$('login-view').classList.add('hidden');$('app-view').classList.remove('hidden');$('account').textContent=profile.display_name+'（'+(profile.role==='admin'?'管理者':'教員')+'）';$('evaluate-teacher').value=profile.display_name;
  await loadProjects();showOnly('project-list-view');
 }catch(e){fail(e,'ユーザー情報の取得');await client.auth.signOut();showLogin();notify('ユーザー情報の取得に失敗しました。管理者にご確認ください。',true,true);}}
async function loadProjects(){state.projects=await checked(client.from('projects').select('id,name,target_kind,scale_count,created_by,created_at').order('created_at',{ascending:false}).limit(200));renderProjects();}
function renderProjects(){const el=$('project-list');if(!state.projects.length){el.textContent='プロジェクトはまだありません。';return;}
 el.innerHTML=state.projects.map(p=>`<div class="item flex between"><div><strong>${escapeHtml(p.name)}</strong><div class="meta">${p.target_kind==='group'?'グループ':'個人'}・${Number(p.scale_count)}段階</div></div><button type="button" class="secondary small" data-project="${escapeHtml(p.id)}">開く</button></div>`).join('');}
async function openProject(id){try{notify('');state.project=state.projects.find(p=>p.id===id);if(!state.project)throw Error('プロジェクトが見つかりません');$('detail-title').textContent=state.project.name;$('detail-subtitle').textContent=(state.project.target_kind==='group'?'グループ':'個人')+'評価・'+state.project.scale_count+'段階';showOnly('project-detail-view');await reloadProject();setTab('targets');}catch(e){fail(e,'プロジェクトの読み込み');}}
async function reloadProject(){const pid=state.project.id;const [targets,criteria,assessments]=await Promise.all([
 checked(client.from('targets').select('id,project_id,name,created_at').eq('project_id',pid).order('created_at')),
 checked(client.from('criteria').select('id,project_id,title,description,descriptors,sort_order').eq('project_id',pid).order('sort_order')),
 checked(client.from('assessments').select('id,project_id,target_id,teacher_id,comment,created_at').eq('project_id',pid).order('created_at',{ascending:false}))]);
 state.targets=targets;state.criteria=criteria;state.assessments=assessments;state.scores=[];
 if(assessments.length){const ids=assessments.map(a=>a.id);for(let i=0;i<ids.length;i+=100){const part=await checked(client.from('assessment_scores').select('id,assessment_id,criterion_id,score').in('assessment_id',ids.slice(i,i+100)));state.scores.push(...part);}}
 renderTargets();renderCriteria();renderTargetSelect();renderResults();renderDescriptorInputs();}
function renderTargets(){const e=$('targets-list');e.innerHTML=state.targets.length?state.targets.map(t=>`<div class="item">${escapeHtml(t.name)}</div>`).join(''):'まだ登録されていません。';}
function descriptorList(c){const d=c.descriptors;if(Array.isArray(d))return d;if(d&&typeof d==='object')return Array.from({length:Number(state.project.scale_count)},(_,i)=>d[String(i+1)]??d[String(i)]??'');return []}
function renderCriteria(){const e=$('criteria-list');e.innerHTML=state.criteria.length?state.criteria.map(c=>`<div class="item"><strong>${escapeHtml(c.title)}</strong><div class="muted">${escapeHtml(c.description||'')}</div><div class="muted">${descriptorList(c).map((x,i)=>`${i+1}：${escapeHtml(x)}`).join(' ／ ')}</div></div>`).join(''):'まだ登録されていません。';}
function renderDescriptorInputs(){const count=Number(state.project?.scale_count||4);$('criterion-descriptors').innerHTML=Array.from({length:count},(_,i)=>`<div><label for="descriptor-${i+1}">${i+1} の基準</label><textarea id="descriptor-${i+1}" required placeholder="${i+1}段階の評価基準"></textarea></div>`).join('');}
function renderTargetSelect(){const el=$('evaluate-target');const prior=state.selectedTarget;el.innerHTML=state.targets.map(t=>`<option value="${escapeHtml(t.id)}">${escapeHtml(t.name)}</option>`).join('');state.selectedTarget=state.targets.some(t=>t.id===prior)?prior:(state.targets[0]?.id||null);if(state.selectedTarget)el.value=state.selectedTarget;renderEvaluation();}
function renderEvaluation(){const body=$('evaluation-body');state.selectedScores={};state.selectedAssessment=null;$('evaluate-comment').value='';$('save-status').textContent='';
 if(!state.targets.length){body.innerHTML='<p class="muted">最初に「評価対象」タブから生徒・グループを登録してください。</p>';$('save-evaluation').disabled=true;return;}
 if(!state.criteria.length){body.innerHTML='<p class="muted">最初に「ルーブリック」タブから評価項目を登録してください。</p>';$('save-evaluation').disabled=true;return;}
 $('save-evaluation').disabled=false;
 // 同一教員・同一対象の最新の評価記録を編集（他教員の評価は変更しない）。
 const existing=state.assessments.find(a=>a.target_id===state.selectedTarget&&a.teacher_id===state.user.id);state.selectedAssessment=existing||null;
 if(existing){$('evaluate-comment').value=existing.comment||'';for(const s of state.scores.filter(x=>x.assessment_id===existing.id))state.selectedScores[s.criterion_id]=Number(s.score);}
 const count=Number(state.project.scale_count);body.innerHTML=`<div class="table-wrap"><table><thead><tr><th>評価項目</th>${Array.from({length:count},(_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead><tbody>${state.criteria.map(c=>{const arr=descriptorList(c);return `<tr><td><strong>${escapeHtml(c.title)}</strong><div class="muted">${escapeHtml(c.description||'')}</div></td>${Array.from({length:count},(_,i)=>`<td><button type="button" data-criterion="${escapeHtml(c.id)}" data-score="${i+1}" class="${state.selectedScores[c.id]===i+1?'selected':''}" aria-pressed="${state.selectedScores[c.id]===i+1}">${escapeHtml(arr[i]??'')}<div class="meta">${i+1} 点</div></button></td>`).join('')}</tr>`}).join('')}</tbody></table></div>`;
}
function setTab(tab){state.tab=tab;for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b.dataset.tab===tab);for(const id of ['targets','criteria','evaluate','results'])$('tab-'+id).classList.toggle('hidden',id!==tab);if(tab==='evaluate')renderEvaluation();if(tab==='results')renderResults();}
function renderResults(){const el=$('results-list');if(!state.assessments.length){el.innerHTML='<p class="muted">評価記録はまだありません。</p>';return;}
 const names=new Map(state.targets.map(t=>[t.id,t.name]));const titleMap=new Map(state.criteria.map(c=>[c.id,c.title]));const list=state.assessments.map(a=>{const scores=state.scores.filter(s=>s.assessment_id===a.id);const parts=scores.map(s=>`${titleMap.get(s.criterion_id)||'評価項目'}：${s.score}`).join(' ／ ');return `<div class="item"><strong>${escapeHtml(names.get(a.target_id)||'対象不明')}</strong> <span class="pill">${a.teacher_id===state.user.id?'自分の評価':'他の教員の評価'}</span><div class="muted">${escapeHtml(parts||'点数なし')}</div><div class="muted">${escapeHtml(a.comment||'')}</div><div class="meta">${escapeHtml(a.created_at?new Date(a.created_at).toLocaleString('ja-JP'):'')}</div></div>`;});el.innerHTML=list.join('');}
async function saveEvaluation(){const missing=state.criteria.filter(c=>!state.selectedScores[c.id]);if(missing.length){notify('すべての評価項目で、段階を1つ選択してください。',true);return;}
 const btn=$('save-evaluation');btn.disabled=true;notify('保存しています…');try{let a=state.selectedAssessment;const comment=$('evaluate-comment').value.trim();if(a){await checked(client.from('assessments').update({comment}).eq('id',a.id).eq('teacher_id',state.user.id));}else{const data=await checked(client.from('assessments').insert({project_id:state.project.id,target_id:state.selectedTarget,teacher_id:state.user.id,comment}).select('id').single());a=data;}
 const existing=state.scores.filter(x=>x.assessment_id===a.id);
 for(const c of state.criteria){const item=existing.find(x=>x.criterion_id===c.id);if(item)await checked(client.from('assessment_scores').update({score:state.selectedScores[c.id]}).eq('id',item.id));else await checked(client.from('assessment_scores').insert({assessment_id:a.id,criterion_id:c.id,score:state.selectedScores[c.id]}));}
 await reloadProject();notify('評価を保存しました。');$('evaluate-target').value=state.selectedTarget;renderEvaluation();$('save-status').textContent='保存済み';
 }catch(e){fail(e,'評価の保存（途中まで保存された可能性があります）');}finally{btn.disabled=false;}}
function csvCell(x){const s=String(x??'');return '"'+s.replace(/"/g,'""')+'"';}
function exportCsv(){if(!state.project)return;const names=new Map(state.targets.map(t=>[t.id,t.name]));const headers=['プロジェクト','評価対象','評価者ID','評価日時',...state.criteria.map(c=>c.title),'コメント'];const lines=[headers];
 for(const a of state.assessments){const scoreMap=new Map(state.scores.filter(s=>s.assessment_id===a.id).map(s=>[s.criterion_id,s.score]));lines.push([state.project.name,names.get(a.target_id)||'',a.teacher_id,a.created_at?new Date(a.created_at).toLocaleString('ja-JP'):'',...state.criteria.map(c=>scoreMap.get(c.id)??''),a.comment||'']);}
 const body='\uFEFF'+lines.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([body],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob);const link=document.createElement('a');link.href=u;link.download='評価結果_'+state.project.name.replace(/[\\/:*?"<>|]/g,'_')+'.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();const no=$('employee').value.trim();if(!/^\d{6}$/.test(no)){notify('職員番号は6桁の数字で入力してください。',true,true);return;}const btn=$('login-button');btn.disabled=true;notify('ログインしています…',false,true);try{const email=`staff${no}@rubric-login.example.com`;const data=await checked(client.auth.signInWithPassword({email,password:$('password').value}));notify('',false,true);await showHome(data.user);}catch(e){console.error(e);notify('ログインできませんでした。職員番号とパスワードを確認してください。',true,true);}finally{btn.disabled=false;}});
$('logout').addEventListener('click',async()=>{await client.auth.signOut();showLogin();notify('ログアウトしました。',false,true);});
$('new-project').addEventListener('click',()=>{notify('');showOnly('project-create-view');});
for(const b of document.querySelectorAll('[data-back]'))b.addEventListener('click',()=>showOnly('project-list-view'));
$('back-list').addEventListener('click',async()=>{try{await loadProjects();showOnly('project-list-view');notify('');}catch(e){fail(e,'一覧の取得');}});
$('project-list').addEventListener('click',e=>{const btn=e.target.closest('[data-project]');if(btn)openProject(btn.dataset.project);});
$('project-form').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;try{const p={name:$('project-name').value.trim(),target_kind:$('project-kind').value,scale_count:Number($('project-scale').value),created_by:state.user.id};if(!p.name)throw Error('名前を入力してください');const created=await checked(client.from('projects').insert(p).select('id').single());await loadProjects();e.target.reset();await openProject(created.id);notify('プロジェクトを作成しました。');}catch(err){fail(err,'プロジェクト作成');}finally{btn.disabled=false;}});
$('targets-form').addEventListener('submit',async e=>{e.preventDefault();const lines=$('target-names').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const names=[...new Set(lines)].filter(x=>!state.targets.some(t=>t.name===x));if(!names.length){notify('追加する新しい名前がありません。',true);return;}const btn=e.target.querySelector('button');btn.disabled=true;try{for(let i=0;i<names.length;i+=100)await checked(client.from('targets').insert(names.slice(i,i+100).map(name=>({project_id:state.project.id,name}))));$('target-names').value='';await reloadProject();notify(names.length+'件を追加しました。');}catch(err){fail(err,'評価対象の登録');}finally{btn.disabled=false;}});
$('criterion-form').addEventListener('submit',async e=>{e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;try{const descriptors=Array.from({length:Number(state.project.scale_count)},(_,i)=>$('descriptor-'+(i+1)).value.trim());if(descriptors.some(x=>!x))throw Error('各段階の基準を入力してください');await checked(client.from('criteria').insert({project_id:state.project.id,title:$('criterion-title').value.trim(),description:$('criterion-description').value.trim(),descriptors,sort_order:state.criteria.length+1}));e.target.reset();await reloadProject();notify('評価項目を追加しました。');}catch(err){fail(err,'評価項目の追加');}finally{btn.disabled=false;}});
for(const b of document.querySelectorAll('[data-tab]'))b.addEventListener('click',()=>{notify('');setTab(b.dataset.tab);});
$('evaluate-target').addEventListener('change',e=>{state.selectedTarget=e.target.value;renderEvaluation();});
$('evaluation-body').addEventListener('click',e=>{const b=e.target.closest('[data-criterion][data-score]');if(!b)return;state.selectedScores[b.dataset.criterion]=Number(b.dataset.score);for(const c of document.querySelectorAll(`[data-criterion="${b.dataset.criterion}"]`)){const yes=Number(c.dataset.score)===Number(b.dataset.score);c.classList.toggle('selected',yes);c.setAttribute('aria-pressed',String(yes));}$('save-status').textContent='未保存';});
$('save-evaluation').addEventListener('click',saveEvaluation);$('export-csv').addEventListener('click',exportCsv);
(async()=>{try{const {data}=await client.auth.getUser();if(data.user)await showHome(data.user);}catch(err){console.error(err);showLogin();}})();
</script>
</body>
</html>
