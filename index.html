<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ルーブリック評価</title>
<style>
:root{font-family:'UD デジタル 教科書体 N-R','UD Digi Kyokasho N-R','Yu Gothic',Meiryo,sans-serif;color:#172941;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#142c4c;color:white;border-bottom:4px solid #b49a59;padding:20px 26px;font-size:22px;font-weight:bold}main{max-width:760px;margin:48px auto;padding:0 18px}.panel{background:white;border:1px solid #e1e4e9;border-radius:6px;padding:28px;box-shadow:0 2px 10px #182a4210}h1{font-size:21px;margin:0 0 25px}label{display:block;margin:18px 0 7px;font-weight:600;font-size:14px}input{width:100%;padding:12px;border:1px solid #c9cfd8;border-radius:4px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:4px;padding:12px 20px;background:#173659;color:#fff;margin-top:22px}button:hover{background:#244c78}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e9edf2;color:#172941}.secondary:hover{background:#dbe1e9}.error{color:#ad2633}.message{margin-top:18px;min-height:24px;font-size:14px}.muted{color:#697687;font-size:14px}.hidden{display:none}ul{padding-left:20px;line-height:2}nav{display:flex;justify-content:space-between;align-items:center;gap:15px}nav button{margin:0}
</style>
</head>
<body>
<header>ルーブリック評価</header>
<main>
<section class="panel" id="login-view">
<h1>ログイン</h1>
<form id="login-form">
<label for="employee">職員番号</label><input id="employee" type="text" inputmode="numeric" autocomplete="username" maxlength="6" pattern="[0-9]{6}" placeholder="6桁の職員番号" required>
<label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required>
<button id="login-button" type="submit">ログイン</button>
</form><div id="login-message" class="message" role="status" aria-live="polite"></div>
</section>
<section class="panel hidden" id="home-view">
<nav><h1 id="welcome">評価プロジェクト</h1><button class="secondary" id="logout" type="button">ログアウト</button></nav>
<p class="muted" id="account"></p><h2 style="font-size:17px;margin-top:32px">プロジェクト一覧</h2><div id="projects" class="muted">読み込み中…</div>
<p class="muted">現在は接続確認用の試作版です。評価の登録機能は次の工程で追加します。</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const PROJECT_URL='https://cdoydtconrygubkyeyym.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_KApWphyPCNW8M9U95_kPCg_Oxuy3KA4';
const client=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
function message(text,isError=false){$('login-message').textContent=text;$('login-message').className='message'+(isError?' error':'');}
function showLogin(){ $('login-view').classList.remove('hidden');$('home-view').classList.add('hidden');$('password').value=''; }
async function showHome(user){
 try{
  const {data:profile,error}=await client.from('profiles').select('employee_no,display_name,role,is_active').eq('id',user.id).single();
  if(error)throw error;
  if(!profile.is_active){await client.auth.signOut();showLogin();message('このアカウントは利用停止中です。',true);return;}
  $('login-view').classList.add('hidden');$('home-view').classList.remove('hidden');
  $('welcome').textContent='評価プロジェクト';
  $('account').textContent=profile.display_name+'（'+(profile.role==='admin'?'管理者':'教員')+'）';
  const result=await client.from('projects').select('id,name,created_at').order('created_at',{ascending:false}).limit(50);
  if(result.error)throw result.error;
  const holder=$('projects');holder.replaceChildren();
  if(!result.data.length){holder.textContent='プロジェクトはまだありません。';return;}
  const list=document.createElement('ul');for(const p of result.data){const item=document.createElement('li');item.textContent=p.name;list.appendChild(item);}holder.appendChild(list);
 }catch(err){$('login-view').classList.add('hidden');$('home-view').classList.remove('hidden');$('projects').textContent='データの取得に失敗しました。Supabaseのアクセス設定を確認してください。';$('account').textContent='';console.error(err);}
}
$('login-form').addEventListener('submit',async e=>{
 e.preventDefault();const no=$('employee').value.trim();if(!/^\d{6}$/.test(no)){message('職員番号は6桁の数字で入力してください。',true);return;}
 const btn=$('login-button');btn.disabled=true;message('ログインしています…');
 try{
  const email=`staff${no}@rubric-login.example.com`;
  const {data,error}=await client.auth.signInWithPassword({email,password:$('password').value});
  if(error)throw error;
  message('');await showHome(data.user);
 }catch(err){console.error(err);message('ログインできませんでした。職員番号とパスワードを確認してください。',true);}finally{btn.disabled=false;}
});
$('logout').addEventListener('click',async()=>{await client.auth.signOut();showLogin();message('ログアウトしました。');});
(async()=>{try{const {data}=await client.auth.getUser();if(data.user)await showHome(data.user);}catch(err){console.error(err);}})();
</script>
</body>
</html>
